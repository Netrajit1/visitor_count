<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NECTAR Visitor Count</title>

<style>
    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }

    .visitor-container {
        width: 100%;
        height: 100%;

        display: flex;
        align-items: center;
        justify-content: center;

        background: transparent;

        font-family: Calibri, Arial, sans-serif;
        font-size: 25px;
        font-weight: bold;
        color: #000000;

        white-space: nowrap;
    }
</style>
</head>

<body>

<div class="visitor-container">
    Visitors Count:&nbsp;<span id="visitor-count">...</span>
</div>

<script>

const API_URL =
    "https://api.counterapi.dev/v1/nectar-geo-portal/visitors/up";

async function updateVisitorCount() {

    const counter =
        document.getElementById("visitor-count");

    try {

        const response = await fetch(API_URL, {
            method: "GET",
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Counter API error");
        }

        const data = await response.json();

        /*
         * CounterAPI returns the current counter value.
         */

        if (data && data.data !== undefined) {

            counter.textContent =
                Number(data.data).toLocaleString("en-IN");

        } else if (data && data.value !== undefined) {

            counter.textContent =
                Number(data.value).toLocaleString("en-IN");

        } else {

            counter.textContent = "0";

        }

    } catch (error) {

        console.error(
            "Unable to load visitor count:",
            error
        );

        /*
         * Do not display an incorrect number
         * if the API is temporarily unavailable.
         */

        counter.textContent = "—";
    }
}

updateVisitorCount();

</script>

</body>
</html>
